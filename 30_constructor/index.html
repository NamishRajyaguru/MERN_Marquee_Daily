<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Constructor</title>
</head>
<body>
    <h2>Create Account</h2>
    <form id="accountForm">
        Customer Name : <input type="text" id="customerName">
        <br><br>
        Balance : <input type="text" id="balance">
        <br><br>
        <button type="submit">Create Account</button>
    </form>

    <hr>

    <h2>Deposit</h2>
    <form id="depositForm">
        <input type="text" placeholder="Account Number" id="accNum">
        <input type="text" placeholder="Amount" id="amnt">
        <button type="submit">Deposit</button>
    </form>

    <hr>

    <h2>Withdraw</h2>
    <form id="withdrawForm">
        <input type="text" placeholder="Account Number" id="withdrawAccNum">
        <input type="text" placeholder="Amount" id="withdrawAmnt">
        <button type="submit">Withdraw</button>
    </form>

    <hr>

    <h2>Account Details / Output</h2>
    <div id="output">No accounts created yet.</div>

    <script src="script.js"></script>
</body>
</html>
